<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa Based Virtual Fencing Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" /> <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"> <!-- Custom Font -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- External CSS -->
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2>LoRa Virtual Fencing</h2>
            </div>
            <ul class="list-unstyled components">
                <li><a href="#" id="menuHome">Home</a></li>
                <li><a href="#" id="menuClear">Clear Path</a></li>
                <li><a href="#" id="menuExport">Export to CSV</a></li>
                <li><a href="#" id="menuSettings">Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div id="content">
            <header>
                <div class="header-bar">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <span>&#9776;</span>
                    </button>
                    <h1>LoRa Based Virtual Fencing</h1>
                </div>
            </header>

            <!-- Controls -->
            <div class="controls">
                <div id="info">
                    <p><strong>Latest Location:</strong></p>
                    <p id="latLon">
                        Node ID: <span id="nodeId">-</span>, 
                        Latitude: <span id="latitude">-</span>, 
                        Longitude: <span id="longitude">-</span>
                    </p>
                </div>
            </div>

            <!-- Map Section -->
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map', { 
            center: [0, 0], 
            zoom: 13,
            zoomControl: true 
        });

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Marker and Polyline layers
        var markers = {}; // To store markers by node ID
        var polylines = {}; // To store polylines by node ID
        var nodeDataList = []; // Array to store node data for CSV export

        // Function to generate a color based on Node ID (You can customize this mapping)
        function getMarkerColor(nodeId) {
            const colors = {
                "NODE_1": "red",
                "NODE_2": "green",
                "NODE_3": "blue",
                "NODE_4": "orange",
                "NODE_5": "purple"
            };

            // If nodeId not found in the mapping, assign a default color
            return colors[nodeId] || "black"; 
        }

        // Function to update map and path
        function updateMap(nodeId, lat, lon) {
            var newLatLng = [lat, lon];
            
            // Check if marker already exists for the node, otherwise create it
            if (!markers[nodeId]) {
                var markerColor = getMarkerColor(nodeId);
                markers[nodeId] = L.marker(newLatLng, { 
                    draggable: false, 
                    icon: L.divIcon({
                        className: 'leaflet-div-icon',
                        html: `<div style="background-color:${markerColor}; width: 20px; height: 20px; border-radius: 50%;"></div>`
                    })
                }).addTo(map);

                // Create a polyline for the node
                polylines[nodeId] = L.polyline([newLatLng], { color: markerColor, weight: 5 }).addTo(map);
            } else {
                // Update existing marker location
                markers[nodeId].setLatLng(newLatLng);
            }

            // Update polyline
            var latLngs = polylines[nodeId].getLatLngs();
            latLngs.push(newLatLng);
            polylines[nodeId].setLatLngs(latLngs);

            // Update displayed information
            document.getElementById('nodeId').textContent = nodeId;
            document.getElementById('latitude').textContent = lat;
            document.getElementById('longitude').textContent = lon;

            // Store the node data for CSV export
            nodeDataList.push({
                node_id: nodeId,
                latitude: lat,
                longitude: lon
            });

            // Update the popup if the marker is clicked
            markers[nodeId].on('click', function() {
                // Check if the popup is already open for the marker
                if (markers[nodeId].isPopupOpen()) {
                    // If it's already open, update the content
                    markers[nodeId].setPopupContent('Node ID: ' + nodeId + '<br>Latitude: ' + lat + '<br>Longitude: ' + lon);
                } else {
                    // Bind and open the new popup if it's not open
                    markers[nodeId].bindPopup('Node ID: ' + nodeId + '<br>Latitude: ' + lat + '<br>Longitude: ' + lon).openPopup();
                }
            });
        }

        // Fetch latest GPS data
        function fetchData() {
            fetch('http://192.168.1.68:5001/get-latest-data')
                .then(response => response.json())
                .then(data => {
                    if (data.node_id && data.lat && data.lon) {
                        updateMap(data.node_id, data.lat, data.lon);
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        // Export to CSV functionality
        function exportToCSV() {
            if (nodeDataList.length === 0) {
                alert("No data available to export.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Node ID,Latitude,Longitude\n";
            nodeDataList.forEach(row => {
                csvContent += `${row.node_id},${row.latitude},${row.longitude}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "gps_tracker_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Clear path on button click
        document.getElementById('menuClear').addEventListener('click', function() {
            for (let nodeId in markers) {
                map.removeLayer(markers[nodeId]); // Remove all markers
                map.removeLayer(polylines[nodeId]); // Remove all polylines
            }
            markers = {}; // Clear markers object
            polylines = {}; // Clear polylines object
            nodeDataList = []; // Clear stored node data
        });

        // Export CSV button click
        document.getElementById('menuExport').addEventListener('click', exportToCSV);

        // Sidebar toggle
        document.getElementById('sidebarCollapse').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });

        // Fetch data periodically
        fetchData();
        setInterval(fetchData, 100); // Every 1 second
    </script>
</body>
</html>
